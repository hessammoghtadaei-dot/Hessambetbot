name: Hessambetbot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
      BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run bot
        run: python bot.py
          git config user.email "hessambetbot@users.noreply.github.com"

          git add matches.json state.json

          git diff --cached --quiet || git commit -m "Update bot data"

          git push
          git config user.email "hessambetbot@users.noreply.github.com"

          git add matches.json state.json

          git diff --cached --quiet || git commit -m "Update bot data"

          git push
