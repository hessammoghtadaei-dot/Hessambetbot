name: Hessambetbot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
        run: |
          python bot.py

      - name: Save bot data
        run: |

          git config user.name "Hessambetbot"

          git config user.email "hessambetbot@users.noreply.github.com"

          git add matches.json state.json

          git diff --cached --quiet || git commit -m "Update bot data"

          git push
          git config user.email "hessambetbot@users.noreply.github.com"

          git add matches.json state.json

          git diff --cached --quiet || git commit -m "Update bot data"

          git push
